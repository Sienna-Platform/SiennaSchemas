name: Validate Schemas

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install jsonschema

      # NOTE: without a SiennaGridDB checkout the (quantity_kind, unit) pairing
      # rule is SKIPPED, not satisfied — this step passing does not prove that
      # rule holds. Enable it by checking GridDB out and passing --griddb-path
      # once GridDB re-types its time columns to OperationalDuration /
      # CalendarPeriod; until then the rule fails on known, tracked drift:
      #
      #   - uses: actions/checkout@v4
      #     with: { repository: Sienna-Platform/SiennaGridDB, path: SiennaGridDB, fetch-depth: 1 }
      #   - run: python scripts/validate_units.py --griddb-path SiennaGridDB
      - name: Validate unit annotations
        run: python scripts/validate_units.py

      - name: Check unit-description sentences are canonical
        run: python scripts/validate_units.py --check-descriptions

      # Also the completeness gate: a selector must declare every schema it
      # reaches, or the generators invent a name per reference site and a
      # shared type silently becomes several.
      - name: Check $ref resolution and selector completeness
        run: python scripts/check_refs.py

      # Layering gate: the InfrastructureCore package must carry no power
      # semantics, so the data layer and the time series store never inherit
      # ACBusType, ThermalFuels, or a cost curve. Membership is pinned in the
      # script, so widening the generic layer is an explicit edit.
      - name: Check package layering
        run: python scripts/check_layering.py

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      # The docs are generated at deploy time and never committed, so they cannot go
      # stale. What CAN break is the generator itself, when a schema grows a shape it
      # does not handle. Building here surfaces that on the PR rather than at release.
      - name: Build the schema reference
        run: |
          python scripts/generate_schema_docs.py --clean
          bundle exec jekyll build --source docs --destination docs/_site --config docs/_config.yml

      # Instance-level gate: the checks above validate annotations and $ref
      # structure, not whether a real association row validates. This catches a
      # oneOf matching two branches and a wrong `required` list.
      - name: Validate time series fixtures
        run: python scripts/validate_fixtures.py

      # Field-name parity against infrastore's catalog row. SKIPs cleanly when
      # no infrastore checkout is present, so a green run here is not evidence
      # the rule holds -- see check_infrastore_parity.py's docstring.
      - name: Check infrastore field parity
        run: python scripts/check_infrastore_parity.py

      # TODO after psy6 merges to PowerSystems main: drop `ref`
      - name: Checkout PowerSystems (psy6) for parity gate
        uses: actions/checkout@v4
        with:
          repository: Sienna-Platform/PowerSystems.jl
          ref: psy6
          path: PowerSystems.jl
          fetch-depth: 1

      # TODO after jd/openapi-1x-suite merges to InfrastructureSystems main: drop `ref`
      - name: Checkout InfrastructureSystems (jd/openapi-1x-suite) for IS-resident struct parity
        uses: actions/checkout@v4
        with:
          repository: Sienna-Platform/InfrastructureSystems.jl
          ref: jd/openapi-1x-suite
          path: InfrastructureSystems.jl
          fetch-depth: 1

      - name: PSY struct parity gate
        run: >-
          python scripts/check_psy_parity.py
          --psy-path PowerSystems.jl
          --is-path InfrastructureSystems.jl

      # PSIP tracks its investment types in src/descriptors/SiennaInvestSchema.json.
      # TODO after the investments catch-up merges to PSIP main: drop `ref`.
      - name: Checkout PowerSystemsInvestmentsPortfolios (jd/openapi-1x-investments-catchup) for parity gate
        uses: actions/checkout@v4
        with:
          repository: Sienna-Platform/PowerSystemsInvestmentsPortfolios.jl
          ref: jd/openapi-1x-investments-catchup
          path: PowerSystemsInvestmentsPortfolios.jl
          fetch-depth: 1

      # Expected red until the investments catch-up lands (PSIP PR #122).
      - name: PSIP struct parity gate
        continue-on-error: true
        run: >-
          python scripts/check_psip_parity.py
          --psip-path PowerSystemsInvestmentsPortfolios.jl
