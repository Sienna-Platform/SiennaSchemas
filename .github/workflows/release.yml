name: Release Schemas

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Tags are needed to diff against the previous release and to build
          # the strict bundles of earlier releases in this compatibility line.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Assert the tag equals info.version
        # A v0.2.0 tag must not ship selectors that still say 0.1.0: generators
        # and readers take the version from info.version.
        run: |
          version=$(jq -r .info.version openapi-core.json)
          if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match info.version ${version} in openapi-core.json" >&2
            exit 1
          fi

      - name: Check version compatibility
        # info.version differs from the previous tag's by construction here, so
        # the gate enforces: the version must cover the schema diff. A describe
        # failure (no earlier tag, missing tags) fails the step: this is the
        # release gate and must not skip itself.
        run: |
          previous=$(git describe --tags --abbrev=0 --exclude '*-*' "${GITHUB_REF_NAME}^")
          python3 scripts/check_compat.py --base "$previous"

      - name: Package schemas
        # Ships the schema tree as authored: the domain schemas, Core/units.json,
        # and the openapi-*.json selectors, plus the strict validation bundles
        # that scripts/build_bundles.py builds into the stage below.
        #
        # Staged into a named directory before archiving, so the tarball unpacks
        # as schemas/ instead of scattering its members into whatever directory
        # the consumer extracts into. v0.1.0 shipped without this:
        # `tar -czf ... .` produced members rooted at `.`, so the one workflow
        # built to ingest it (PowerOpenAPIModels' update-schema.yml, which
        # extracts with `-C /tmp` then mounts /tmp/schemas) mounted a path the
        # archive never created.
        #
        # Staged under RUNNER_TEMP, not into the checkout: tar reads `.` while
        # writing, so an archive inside `.` is a file that changes as tar reads
        # it, which GNU tar exits 1 on.
        run: |
          # The directory is named `schemas`, not `schemas-<tag>`: the consumer
          # extracts with `-C /tmp` and mounts /tmp/schemas, a fixed path. The
          # tag already distinguishes releases via the archive filename.
          stage="$RUNNER_TEMP/schemas"
          rm -rf "$stage" && mkdir -p "$stage"
          # Everything a consumer needs, and nothing internal: .claude, .github,
          # tests/ and the Jekyll Gemfiles are development tooling, not schema.
          cp -r Core Operations Investments Dynamics TimeSeries docs scripts \
                openapi-*.json README.md CHANGELOG.md LICENSE "$stage/"
          find "$stage" -name __pycache__ -prune -exec rm -rf {} +
          # Strict validation bundles for every release in this line up to this
          # one: a document stamped with any of them is checked against its own.
          python3 scripts/build_bundles.py --line --out "$stage/bundles"
          # The reader-rule test vectors, outside tests/ (which must not ship):
          # each binding runs them against its own version check.
          mkdir "$stage/versioning"
          cp tests/fixtures/versioning/cases.json "$stage/versioning/"
          tar -czf "$RUNNER_TEMP/schemas-${GITHUB_REF_NAME}.tar.gz" -C "$RUNNER_TEMP" schemas
          echo "Top-level members:"
          tar -tzf "$RUNNER_TEMP/schemas-${GITHUB_REF_NAME}.tar.gz" | awk -F/ '{print $1}' | sort -u

      - name: Assert the tarball unpacks into a single directory
        # The defect this release workflow shipped in v0.1.0, turned into a gate.
        run: |
          archive="$RUNNER_TEMP/schemas-${GITHUB_REF_NAME}.tar.gz"
          roots=$(tar -tzf "$archive" | awk -F/ '{print $1}' | sort -u)
          if [ "$roots" != "schemas" ]; then
            echo "::error::tarball must unpack into a single top-level directory named 'schemas' (the path consumers mount), got: $roots" >&2
            exit 1
          fi
          for internal in .claude .github tests Gemfile; do
            if tar -tzf "$archive" | grep -q "^schemas/$internal"; then
              echo "::error::internal tooling $internal must not ship in the release tarball" >&2
              exit 1
            fi
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ runner.temp }}/schemas-${{ github.ref_name }}.tar.gz
          generate_release_notes: true

  notify:
    # Each downstream repo regenerates on this dispatch and opens a PR; merging
    # that PR releases the SDK. Needs the release to exist, since the receivers
    # download its tarball. repository_dispatch into another repo needs a token
    # with contents: write there, which GITHUB_TOKEN never has.
    needs: release
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        repo: [PowerOpenAPIModels, power-openapi-models]
    steps:
      - uses: actions/create-github-app-token@v1
        id: app-token
        with:
          app-id: ${{ secrets.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          owner: Sienna-Platform
          repositories: ${{ matrix.repo }}

      - name: Dispatch schema-release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh api "repos/Sienna-Platform/${{ matrix.repo }}/dispatches" \
            -f event_type=schema-release -f "client_payload[tag]=${GITHUB_REF_NAME}"
