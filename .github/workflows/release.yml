name: Release Schemas

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Package schemas
        # Tarball ships the schema tree as authored: the domain schemas,
        # Core/units.json, and the openapi-*.json selectors. Both codegen
        # toolchains resolve the $ref graph themselves, so there is nothing to
        # build first.
        run: tar -czf schemas-${{ github.ref_name }}.tar.gz --exclude='.git' .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: schemas-${{ github.ref_name }}.tar.gz
          generate_release_notes: true
